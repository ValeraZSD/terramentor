<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Terramentor</title>

    <!-- PWA / installable app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Repointed by the theme boot below and by `applyThemeToDom`. The value
         here is only what an installed PWA's splash uses before any script runs;
         everything after that follows the theme the learner actually chose. -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS standalone web app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Terramentor" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- The SVG first, so the tab draws the mark at whatever size the browser
         wants it. The PNGs are the fallback and are a SEPARATE cut of the same
         artwork: at 16 px the globe's grid lines are sub-pixel and wash the
         middle of the mark into grey, so the small cut drops the grid and
         draws a heavier line (measured in `tools/brand.mjs --check`).
         Regenerate all of them with `node tools/brand.mjs --apply`. -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />

    <!-- Theme boot: replays the cached theme before the first paint (see the file). -->
    <script src="/theme-boot.js"></script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
