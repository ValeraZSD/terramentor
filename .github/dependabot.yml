# Dependency updates, weekly, grouped.
#
# Minor and patch bumps arrive as ONE pull request per ecosystem: this repo has
# a native-addon build (better-sqlite3, @napi-rs/canvas, sqlite-vec) and a full
# guard suite to run against every change, so twenty separate PRs a week would
# cost more attention than they save. Majors still come one at a time, because
# each one needs reading; vite and @vitejs/* are the exception and always
# arrive together, minors and patches included (the `vite` group below).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The ```p5 visual runs p5 1.x in its sandbox. 2.x removed or changed
      # APIs that model-written sketches use (curveVertex, keyCode, the
      # 6-argument bezierVertex), and its exports map hides lib/p5.min.js.
      # Moving is a port with a render check, not a version bump.
      - dependency-name: p5
        update-types:
          - version-update:semver-major
      # pdfjs-dist must be the exact version pdf-parse pins, or two copies
      # share one worker and PDF math recovery fails (tools/dep-gates.mjs).
      # It moves in the same change as pdf-parse, never on its own.
      - dependency-name: pdfjs-dist
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      # @vitejs/plugin-react's majors follow vite's (6.x needs vite 8), so
      # apart they arrive as two pull requests that each fail without the
      # other. The first group that matches wins, so this one comes first.
      vite:
        patterns:
          - vite
          - "@vitejs/*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The Dockerfile's base image and the compose file's optional Ollama are
  # pinned by digest; this raises those digests (and the Ollama tag) as one
  # reviewed pull request a week. The Node major and the bookworm base are a
  # decision, not a bump: the native addons need glibc and the app's Node
  # floor, so majors are left to a person.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    groups:
      images:
        patterns:
          - "*"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
