# Building and publishing a release, however it was started:
#
#   git tag v1.2.0 && git push origin v1.2.0   a stable release of exactly that commit
#   the Nightly workflow (nightly.yml)         main as a nightly prerelease, or the commit
#                                              of the latest nightly promoted to stable
#   a pull request touching the files below    all of it, publishing nothing (a dry run)
#
# Every path runs the same gates a pull request runs, then builds the container
# image and the desktop zips, then opens the GitHub Release with SHA256SUMS and
# manifest.json beside the zips.
#
# WHY THE IMAGE MATTERS MORE THAN THE TAG. `git clone && npm install` is the
# install barrier ROADMAP.md calls the project's biggest problem. A published
# image turns installing into `docker compose up -d` and updating into
# `docker compose pull && docker compose up -d` — the same two commands forever,
# and the user's machine needs nothing but Docker. The git tag is what the
# update check reads; the image is what people actually run.
#
# PRERELEASES ARE HOW A RELEASE STAYS OFF THE STABLE CHANNEL. A nightly, or a
# tag like `v1.3.0-rc.1`, is marked as a prerelease here, which means GitHub's
# `/releases/latest` endpoint, the one the stable channel's update check reads,
# skips it and keeps pointing at the last full release. A prerelease does not
# move the `latest` image tag either. Only an install switched to the Nightly
# channel looks at prereleases at all (server/version.js).
#
# MANIFEST.JSON is what an updater checks a download against: per platform, the
# zip's URL, size and SHA-256 (tools/lib/releaseChannel.mjs, buildManifest).
name: Release

on:
  push:
    # Nightly tags are created by the release this workflow publishes, never
    # pushed by hand; the exclusion keeps a stray one from building twice.
    tags: ['v*', '!v*-nightly.*']
  workflow_call:
    inputs:
      channel:
        description: stable or nightly
        type: string
        required: true
      version:
        description: The version to publish, without the v
        type: string
        required: true
      ref:
        description: The commit to build
        type: string
        required: true
      previous:
        description: The tag a nightly's notes list commits since
        type: string
        required: false
        default: ''
  # A change to the release machinery is exercised before it is trusted with a
  # tag: build everything, publish nothing. The v1.1.0 tag failed in this
  # workflow on a Linux-only gate that no pull request had run.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/nightly.yml
      - tools/release.mjs
      - tools/lib/releaseChannel.mjs
      - tools/build-desktop.mjs
      - tools/first-visit-smoke.sh
      - Dockerfile
      - desktop/**

# Read-only by default; only the jobs that actually publish grant write, and
# only the scope they need (image → packages, release → contents). Workflow-wide
# write tokens used to reach the verify and desktop jobs too, which run nothing
# that publishes (third-party audit, tightened 2026-09-17).
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # What is being released: channel, version, commit, and whether anything is
  # published at all. Every later job reads these outputs and nothing else, so a
  # nightly and a promotion (whose triggering commit is main's head, not the
  # commit they build) cannot pick up `github.sha` by accident.
  plan:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      previous: ${{ steps.plan.outputs.previous }}
      publish: ${{ steps.plan.outputs.publish }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      latest: ${{ steps.plan.outputs.latest }}
      minor: ${{ steps.plan.outputs.minor }}
      built_at: ${{ steps.plan.outputs.built_at }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # A dry run prints what the schedule would decide for main right now, then
      # versions this pull request's build the way a nightly of it would be.
      - id: dry
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          GITHUB_OUTPUT= node tools/release.mjs plan --sha "$(git rev-parse origin/main)"
          node tools/release.mjs plan --force

      # Channel, version and commit from how this run started (releasePlan in
      # tools/lib/releaseChannel.mjs). A suffixed tag (v1.3.0-rc.1) is a
      # prerelease like a nightly; only a plain stable X.Y.Z becomes Latest and
      # moves the `latest` image.
      - id: plan
        env:
          IN_CHANNEL: ${{ inputs.channel }}
          IN_VERSION: ${{ inputs.version }}
          IN_REF: ${{ inputs.ref }}
          IN_PREVIOUS: ${{ inputs.previous }}
          DRY_VERSION: ${{ steps.dry.outputs.version }}
          DRY_PREVIOUS: ${{ steps.dry.outputs.previous }}
        run: node tools/release.mjs resolve

  # Nothing is published until the guard suites pass. A release is a promise
  # that this build is worth running, and the whole suite takes minutes.
  # The suites run on the commit as it is, before a nightly's version is stamped
  # on: they check that CHANGELOG.md documents package.json's version.
  verify:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default single commit: tools/no-ai-attribution.mjs
      # reads commit messages over a range, and a shallow clone has no range to
      # read — it would pass by having nothing to look at.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Server parses
        run: |
          for f in server/*.js server/routes/*.js; do node --check "$f"; done
      - name: Guard suites
        run: npm test
      - name: Frontend builds
        run: npm run build

      # A stable release must say exactly what package.json says, or the app
      # reports one version while the update check compares another and every
      # install thinks it is permanently out of date. A nightly must sort above
      # it. Cheap to check, silent and confusing to miss.
      - name: The version agrees with package.json
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: node tools/release.mjs check-version --channel "$CHANNEL" --version "$VERSION"

  image:
    needs: [plan, verify]
    # A real release builds only once the gates pass. A dry run builds even when
    # they fail, so a pull request learns whether the packaging works on its own.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.verify.result == 'success' || needs.plan.outputs.publish != 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
    steps:
      # A shallow checkout on purpose: a Docker build reads the working tree, not
      # the log, and the commit it stamps into the image comes from the plan.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # The app reads its version from package.json at runtime, so a nightly is
      # written into it here, in this checkout only, before the image copies it.
      - name: Stamp the nightly version
        if: needs.plan.outputs.channel == 'nightly'
        run: node tools/release.mjs stamp "${{ needs.plan.outputs.version }}"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: needs.plan.outputs.publish == 'true'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: needs.plan.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every release gets its exact version. A plain stable release also gets
      # its minor line (so a compose file can pin 1.2 and still get patches) and
      # `latest`; a nightly gets `nightly` and never `latest`.
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.plan.outputs.version }}
            type=raw,value=${{ needs.plan.outputs.minor }},enable=${{ needs.plan.outputs.latest == 'true' }}
            type=raw,value=latest,enable=${{ needs.plan.outputs.latest == 'true' }}
            type=raw,value=nightly,enable=${{ needs.plan.outputs.channel == 'nightly' }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ needs.plan.outputs.publish == 'true' }}
          # A dry run loads the image into the runner's Docker instead, which
          # works for one platform only; arm64 is exercised by real releases.
          load: ${{ needs.plan.outputs.publish != 'true' }}
          # arm64 as well as amd64: an Apple Silicon Mac and a Raspberry Pi are
          # both plausible homes for a local-first study app, and all three native
          # dependencies (better-sqlite3, @napi-rs/canvas, sqlite-vec) ship arm64
          # prebuilds, so neither arch has to compile anything.
          platforms: ${{ needs.plan.outputs.publish == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Identity for a build with no `.git` in it — see the ARG in Dockerfile.
          build-args: |
            GIT_SHA=${{ needs.plan.outputs.ref }}
            BUILD_TIME=${{ needs.plan.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is STARTED before the release names it. Building proves it
      # compiles; only running it proves the first visit works as the README
      # says: the page loads, a visit from outside the container meets the
      # setup-code gate, the code is in `docker logs`, and it opens the library.
      # The desktop zips already start themselves before they are published.
      - name: The image starts and its first visit works
        env:
          IMG: ${{ needs.plan.outputs.publish == 'true' && format('{0}@{1}', env.IMAGE, steps.build.outputs.digest) || format('{0}:{1}', env.IMAGE, needs.plan.outputs.version) }}
        # `${IMG,,}`: the repository is ValeraZSD/terramentor, and a Docker
        # reference must be lowercase (the metadata action lowercases its tags;
        # a reference built here has to do it itself).
        run: |
          docker run -d --name smoke -p 127.0.0.1:3001:3001 "${IMG,,}"
          bash tools/first-visit-smoke.sh http://127.0.0.1:3001 "docker logs smoke"
          docker rm -f smoke

  # The desktop packages: one zip per OS, each carrying its own Node runtime,
  # built by tools/build-desktop.mjs on that OS. Built ON the OS rather than
  # cross-built because the three native dependencies (better-sqlite3,
  # @napi-rs/canvas, sqlite-vec) are fetched as prebuilds for the machine that
  # runs `npm ci`, and the runner's Node — pinned by setup-node — is the runtime
  # that ships (see the header of the build script). The staged copy starts
  # itself in a scratch data directory before it is zipped; a package that does
  # not start never reaches the release. macOS builds on Apple Silicon; an Intel
  # Mac runs the zip through Rosetta.
  desktop:
    needs: [plan, verify]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.verify.result == 'success' || needs.plan.outputs.publish != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      # Before `npm ci`, and into the lockfile too, so the two never disagree.
      # The zip's name, its build.json and the version the app reports all come
      # from package.json.
      - name: Stamp the nightly version
        if: needs.plan.outputs.channel == 'nightly'
        run: node tools/release.mjs stamp "${{ needs.plan.outputs.version }}"
      - run: npm ci
      - run: npm run build
      - name: Package
        run: node tools/build-desktop.mjs --skip-build
        env:
          GIT_SHA: ${{ needs.plan.outputs.ref }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.os }}
          path: release/*.zip
          if-no-files-found: error

  release:
    needs: [plan, verify, image, desktop]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.image.result == 'success' && needs.desktop.result == 'success' && (needs.verify.result == 'success' || needs.plan.outputs.publish != 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release and, for a nightly or a promotion, its tag
    steps:
      # Full history: a nightly's notes list the commits since the previous one.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      # SHA256SUMS for every file, and manifest.json: per platform, the zip's
      # URL, size and SHA-256, which is what an updater checks a download against.
      - name: Checksums and the update manifest
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
          VERSION: ${{ needs.plan.outputs.version }}
          REF: ${{ needs.plan.outputs.ref }}
          BUILT_AT: ${{ needs.plan.outputs.built_at }}
        run: node tools/release.mjs assets --dir release --channel "$CHANNEL" --version "$VERSION" --commit "$REF" --built-at "$BUILT_AT"

      # The body: a stable release's CHANGELOG section (a missing one becomes a
      # sentence, never a blank body), or the commits a nightly adds; then how
      # to install this exact tag.
      - name: Release notes
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
          VERSION: ${{ needs.plan.outputs.version }}
          REF: ${{ needs.plan.outputs.ref }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
        run: node tools/release.mjs notes --channel "$CHANNEL" --version "$VERSION" --sha "$REF" --since "$PREVIOUS" --out release-notes.md

      # The tag of a nightly or a promotion does not exist yet; this creates it
      # on the planned commit. It is created with GITHUB_TOKEN, and GitHub starts
      # no workflow for an event that token causes, so it does not trigger this
      # workflow's own `push: tags` a second time. Replacing the token with a
      # personal one would.
      - if: needs.plan.outputs.publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ needs.plan.outputs.ref }}
          name: ${{ needs.plan.outputs.channel == 'nightly' && format('Nightly {0}', needs.plan.outputs.version) || needs.plan.outputs.tag }}
          prerelease: ${{ needs.plan.outputs.prerelease }}
          make_latest: ${{ needs.plan.outputs.latest }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            release/*.zip
            release/SHA256SUMS
            release/manifest.json

      - name: Dry run, nothing published
        if: needs.plan.outputs.publish != 'true'
        run: |
          {
            echo "### Dry run: nothing was published"
            echo
            echo "A release of this commit would be \`${{ needs.plan.outputs.tag }}\` with this manifest.json:"
            echo
            echo '```json'
            cat release/manifest.json
            echo '```'
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: needs.plan.outputs.publish != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dry-run
          path: |
            release/SHA256SUMS
            release/manifest.json
            release-notes.md
