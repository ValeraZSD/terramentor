# Building and publishing a release, however it was started:
#
#   git tag v1.2.0 && git push origin v1.2.0   a stable release of exactly that commit
#   the Nightly workflow (nightly.yml)         main as a nightly prerelease, or a named
#                                              nightly (or its release/X.Y branch) as stable
#   a pull request touching the files below    all of it, publishing nothing (a dry run)
#
# Every path runs the same gates a pull request runs, then builds the container
# image and the desktop zips, then opens the GitHub Release with SHA256SUMS,
# manifest.json and manifest.json.sig beside the zips.
#
# WHY THE IMAGE MATTERS MORE THAN THE TAG. `git clone && npm install` is the
# install barrier, the project's biggest problem. A published
# image turns installing into `docker compose up -d` and updating into
# `docker compose pull && docker compose up -d` — the same two commands forever,
# and the user's machine needs nothing but Docker. The git tag is what the
# update check reads; the image is what people actually run.
#
# PRERELEASES ARE HOW A RELEASE STAYS OFF THE STABLE CHANNEL. A nightly, or a
# tag like `v1.3.0-rc.1`, is marked as a prerelease here, which means GitHub's
# `/releases/latest` endpoint, the one the stable channel's update check reads,
# skips it and keeps pointing at the last full release. A prerelease does not
# move the `latest` image tag either. Only an install switched to the Nightly
# channel looks at prereleases at all (server/version.js).
#
# MANIFEST.JSON is what an updater checks a download against: per platform, the
# zip's URL, size and SHA-256 (tools/lib/releaseChannel.mjs, buildManifest).
# MANIFEST.JSON.SIG signs it with the channel's key, which only the release
# job can read, from its GitHub environment (see that job).
name: Release

on:
  push:
    # Nightly tags are created by the release this workflow publishes, never
    # pushed by hand; the exclusion keeps a stray one from building twice.
    tags: ['v*', '!v*-nightly.*']
  workflow_call:
    inputs:
      channel:
        description: stable or nightly
        type: string
        required: true
      version:
        description: The version to publish, without the v
        type: string
        required: true
      ref:
        description: The commit to build
        type: string
        required: true
      previous:
        description: The tag a nightly's notes list commits since
        type: string
        required: false
        default: ''
  # A change to the release machinery is exercised before it is trusted with a
  # tag: build everything, publish nothing, so a platform-only gate that no
  # pull request runs cannot first fail on the tag itself.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/nightly.yml
      - tools/release.mjs
      - tools/lib/releaseChannel.mjs
      - tools/build-desktop.mjs
      - tools/macos-open-check.sh
      - tools/first-visit-smoke.sh
      - Dockerfile
      - desktop/**
      # The MCP server ships in both packages and is started against each.
      - mcp/**
      - tools/mcp-smoke.mjs
      - tools/lib/runtimeSources.mjs

# Read-only by default; only the jobs that actually publish grant write, and
# only the scope they need (image → packages, release → contents). Workflow-wide
# write tokens would reach the verify and desktop jobs too, which run nothing
# that publishes.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # What is being released: channel, version, commit, and whether anything is
  # published at all. Every later job reads these outputs and nothing else, so a
  # nightly and a promotion (whose triggering commit is main's head, not the
  # commit they build) cannot pick up `github.sha` by accident.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read     # the dry run asks whether a nightly of main already failed
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      previous: ${{ steps.plan.outputs.previous }}
      publish: ${{ steps.plan.outputs.publish }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      latest: ${{ steps.plan.outputs.latest }}
      moving_tags: ${{ steps.plan.outputs.moving_tags }}
      built_at: ${{ steps.plan.outputs.built_at }}
    steps:
      # No checkout in this workflow keeps the token in .git/config: nothing
      # here pushes with git, and the jobs that hold write tokens run the
      # checked-out commit's own scripts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # A dry run prints what the schedule would decide for main right now, then
      # versions this pull request's build the way a nightly of it would be.
      - id: dry
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          GITHUB_OUTPUT= node tools/release.mjs plan --sha "$(git rev-parse origin/main)"
          node tools/release.mjs plan --force

      # Channel, version and commit from how this run started (releasePlan in
      # tools/lib/releaseChannel.mjs). It refuses to publish a commit that is not
      # on main, or, for a stable release, on its own release/X.Y. A suffixed tag (v1.3.0-rc.1) is a prerelease like a nightly;
      # only a plain stable X.Y.Z, and not an older line's hotfix, becomes
      # Latest and moves the `latest` image.
      - id: plan
        env:
          IN_CHANNEL: ${{ inputs.channel }}
          IN_VERSION: ${{ inputs.version }}
          IN_REF: ${{ inputs.ref }}
          IN_PREVIOUS: ${{ inputs.previous }}
          DRY_VERSION: ${{ steps.dry.outputs.version }}
          DRY_PREVIOUS: ${{ steps.dry.outputs.previous }}
        run: node tools/release.mjs resolve

  # Nothing is published until the guard suites pass. A release is a promise
  # that this build is worth running, and the whole suite takes minutes.
  # The suites run on the commit as it is, before a nightly's version is stamped
  # on: they check that CHANGELOG.md documents package.json's version.
  #
  # Gates (gates.yml) runs the same steps on every push to main, on Linux and
  # on Windows. When it has already passed on exactly the commit being
  # released, running them again here proves nothing new and holds every later
  # job for a quarter of an hour; they are skipped, and the summary says why.
  # Anything else (Gates still running, failed, never run on this commit, or
  # GitHub not answering) runs them here as before. A dry run never asks: its
  # commit is a pull request's merge commit, which no push made.
  verify:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read      # Gates' checks on this commit
      actions: read     # the run each one came from: Gates, started by a push
    steps:
      # Full history, not the default single commit: tools/no-ai-attribution.mjs
      # reads commit messages over a range, and a shallow clone has no range to
      # read — it would pass by having nothing to look at.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - id: gates
        if: needs.plan.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REF: ${{ needs.plan.outputs.ref }}
        run: node tools/release.mjs gates-passed --sha "$REF"
      - run: npm ci
        if: steps.gates.outputs.passed != 'true'
      - run: npx tsc --noEmit && npx tsc -p tsconfig.server.json
        if: steps.gates.outputs.passed != 'true'
      - name: Server parses
        if: steps.gates.outputs.passed != 'true'
        run: |
          for f in server/*.js server/routes/*.js; do node --check "$f"; done
      - name: Guard suites
        if: steps.gates.outputs.passed != 'true'
        run: npm test
      - name: Frontend builds
        if: steps.gates.outputs.passed != 'true'
        run: npm run build

      # A stable release must say exactly what package.json says, or the app
      # reports one version while the update check compares another and every
      # install thinks it is permanently out of date. A nightly must sort above
      # it. Cheap to check, silent and confusing to miss.
      - name: The version agrees with package.json
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: node tools/release.mjs check-version --channel "$CHANNEL" --version "$VERSION"

  # The container image, for amd64 and arm64: an Apple Silicon Mac and a
  # Raspberry Pi are both plausible homes for a local-first study app, and all
  # three native dependencies (better-sqlite3, @napi-rs/canvas, sqlite-vec)
  # ship arm64 prebuilds, so neither arch has to compile anything.
  #
  # Each architecture builds on a runner of its own kind, side by side, rather
  # than arm64 under emulation on an amd64 runner, which took most of this
  # job's eight minutes. Each one is started and its first visit checked on
  # that runner, so the arm64 image is run before it is published, not only
  # built. A real release pushes each by digest alone, with no tag; the `image`
  # job below joins the two into the one multi-arch image the tag names.
  image-arch:
    needs: [plan, verify]
    # A real release builds only once the gates pass. A dry run builds even when
    # they fail, so a pull request learns whether the packaging works on its own.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.verify.result == 'success' || needs.plan.outputs.publish != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write   # push to ghcr.io
    steps:
      # A shallow checkout on purpose: a Docker build reads the working tree, not
      # the log, and the commit it stamps into the image comes from the plan.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # The app reads its version from package.json at runtime, so a nightly is
      # written into it here, in this checkout only, before the image copies it.
      - name: Stamp the nightly version
        if: needs.plan.outputs.channel == 'nightly'
        run: node tools/release.mjs stamp "${{ needs.plan.outputs.version }}"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: needs.plan.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The labels, and the exact version as the tag a dry run loads the image
      # under. A real release pushes this architecture with no tag at all.
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.plan.outputs.version }}

      # Lowercase, as a Docker reference must be (see the step after the build).
      - id: name
        run: echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          # A real release pushes by digest only; a dry run loads the image into
          # the runner's Docker under its version tag, and pushes nothing.
          outputs: ${{ needs.plan.outputs.publish == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.name.outputs.image) || '' }}
          load: ${{ needs.plan.outputs.publish != 'true' }}
          tags: ${{ needs.plan.outputs.publish != 'true' && steps.meta.outputs.tags || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          # Identity for a build with no `.git` in it — see the ARG in Dockerfile.
          build-args: |
            GIT_SHA=${{ needs.plan.outputs.ref }}
            BUILD_TIME=${{ needs.plan.outputs.built_at }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      # The image is STARTED before the release names it. Building proves it
      # compiles; only running it proves the first visit works as the README
      # says: the page loads, a visit from outside the container meets the
      # setup-code gate, the code is in `docker logs`, and it opens the library.
      # The desktop zips already start themselves before they are published.
      - name: The image starts and its first visit works
        env:
          IMG: ${{ needs.plan.outputs.publish == 'true' && format('{0}@{1}', env.IMAGE, steps.build.outputs.digest) || format('{0}:{1}', env.IMAGE, needs.plan.outputs.version) }}
        # `${IMG,,}`: the repository is ValeraZSD/terramentor, and a Docker
        # reference must be lowercase (the metadata action lowercases its tags;
        # a reference built here has to do it itself).
        #
        # Then the MCP server in the image, started inside the container the way
        # docs/MCP.md tells a Docker user to start it (`docker exec -i`), with
        # the probe piped in because the image has no tools/ folder. The first
        # visit has set a password, as it does for everyone who runs the image,
        # so the server needs the API key: sign in with that password (the one
        # first-visit-smoke.sh sets), make a key, and pass it in.
        run: |
          docker run -d --name smoke -p 127.0.0.1:3001:3001 "${IMG,,}"
          bash tools/first-visit-smoke.sh http://127.0.0.1:3001 "docker logs smoke"
          jar="$(mktemp)"
          curl -sSf -c "$jar" -H 'Origin: http://127.0.0.1:3001' -H 'Content-Type: application/json' \
            -d '{"password":"first-visit-smoke"}' http://127.0.0.1:3001/api/auth/login > /dev/null
          key="$(curl -sSf -b "$jar" -H 'Origin: http://127.0.0.1:3001' -X POST http://127.0.0.1:3001/api/auth/apikey/regenerate \
            | node -e "let s='';process.stdin.on('data',(d)=>{s+=d}).on('end',()=>process.stdout.write(JSON.parse(s).apiKey))")"
          echo "::add-mask::$key"
          docker exec -i -e TERRAMENTOR_API_KEY="$key" smoke node --input-type=module - /app < tools/mcp-smoke.mjs
          docker rm -f smoke

      # The digest this architecture was pushed under, for the `image` job,
      # only after the image passed its first visit above.
      - name: Hand the digest on
        if: needs.plan.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.plan.outputs.publish == 'true'
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # The two architectures as ONE image under its exact version, the tag a user
  # pins: a manifest list naming both digests, made in the registry from what
  # was pushed, so nothing is rebuilt and the build provenance each push
  # carries stays attached. Only the exact version here. The tags that MOVE
  # (`latest`, the minor and major lines, or `nightly`) are pointed at this
  # image by the image-tags job, after the release is published: a build that
  # fails later, in the zips or the release, must not have moved what
  # `docker compose pull` fetches. A dry run pushed nothing, so it has nothing
  # to join.
  image:
    needs: [plan, image-arch]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.image-arch.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write   # push the joined manifest to ghcr.io
    outputs:
      digest: ${{ steps.join.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.plan.outputs.publish == 'true'
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: needs.plan.outputs.publish == 'true'
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: needs.plan.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: join
        if: needs.plan.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          image="${IMAGE,,}"
          sources=()
          for d in "$RUNNER_TEMP"/digests/*; do sources+=("$image@sha256:$(basename "$d")"); done
          if [ "${#sources[@]}" != 2 ]; then
            echo "::error::Expected an amd64 and an arm64 digest, found ${#sources[@]}."
            exit 1
          fi
          docker buildx imagetools create -t "$image:$VERSION" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          case "$digest" in sha256:*) ;; *) echo "::error::No digest for $image:$VERSION"; exit 1 ;; esac
          docker buildx imagetools inspect "$image:$VERSION"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # The desktop packages: one zip per OS, each carrying its own Node runtime,
  # built by tools/build-desktop.mjs on that OS. Built ON the OS rather than
  # cross-built because the three native dependencies (better-sqlite3,
  # @napi-rs/canvas, sqlite-vec) are fetched as prebuilds for the machine that
  # runs `npm ci`, and the runner's Node — pinned by setup-node — is the runtime
  # that ships (see the header of the build script). The staged copy starts
  # itself in a scratch data directory before it is zipped; a package that does
  # not start never reaches the release. macOS builds on Apple Silicon only:
  # its Node and native modules are arm64, which an Intel Mac cannot run.
  desktop:
    needs: [plan, verify]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.verify.result == 'success' || needs.plan.outputs.publish != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      # Before `npm ci`, and into the lockfile too, so the two never disagree.
      # The zip's name, its build.json and the version the app reports all come
      # from package.json.
      - name: Stamp the nightly version
        if: needs.plan.outputs.channel == 'nightly'
        run: node tools/release.mjs stamp "${{ needs.plan.outputs.version }}"
      - run: npm ci
      - run: npm run build
      - name: Package
        run: node tools/build-desktop.mjs --skip-build
        env:
          GIT_SHA: ${{ needs.plan.outputs.ref }}
      # The zip against its size budget (tools/perf-budgets.json): a download
      # that grew past it is raised on purpose, in that file, or not shipped.
      - name: Package within its size budget
        run: node tools/perf-budget-gates.mjs --package release/*.zip
        shell: bash
      # The macOS package opened as a person opens it: the bundle copied on its
      # own out of the unpacked zip, started through LaunchServices, marked as
      # downloaded, then not, then read-only (tools/macos-open-check.sh).
      - name: Open the macOS app from a copy of the bundle alone
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: bash tools/macos-open-check.sh release/Terramentor-*-darwin-*.zip "$RUNNER_TEMP/macos-shots"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'macOS'
        with:
          name: macos-open-check
          path: ${{ runner.temp }}/macos-shots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: release/*.zip
          if-no-files-found: error

  # The job that signs and publishes runs in its channel's GitHub environment,
  # which is where the signing key lives (secret RELEASE_SIGNING_KEY):
  # `release-stable` has a required reviewer, so a stable release waits here,
  # everything built, until the maintainer presses Approve; `release-nightly`
  # signs without anyone; a dry run's `release-dry-run` holds no key at all.
  # Both real environments accept runs from main and `v*` tags only.
  release:
    needs: [plan, verify, image, desktop]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.image.result == 'success' && needs.desktop.result == 'success' && (needs.verify.result == 'success' || needs.plan.outputs.publish != 'true') }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.plan.outputs.publish != 'true' && 'release-dry-run' || needs.plan.outputs.channel == 'stable' && 'release-stable' || 'release-nightly' }}
    permissions:
      contents: write   # create the GitHub Release and, for a nightly or a promotion, its tag
    steps:
      # Full history: a nightly's notes list the commits since the previous one.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      # SHA256SUMS for every file, and manifest.json: per platform, the zip's
      # URL, size and SHA-256, which is what an updater checks a download against.
      - name: Checksums and the update manifest
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
          VERSION: ${{ needs.plan.outputs.version }}
          REF: ${{ needs.plan.outputs.ref }}
          BUILT_AT: ${{ needs.plan.outputs.built_at }}
        run: node tools/release.mjs assets --dir release --channel "$CHANNEL" --version "$VERSION" --commit "$REF" --built-at "$BUILT_AT"

      # manifest.json.sig: what an installed copy checks before it downloads
      # anything else. The key reaches this step and no other. It must be the
      # one desktop/updateCore.js lists for the channel, or this step fails
      # rather than publish a release no install could take. A dry run signs
      # with a throwaway key, so the step runs on every pull request too.
      - name: Sign the manifest
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
          RELEASE_SIGNING_KEY: ${{ needs.plan.outputs.publish == 'true' && secrets.RELEASE_SIGNING_KEY || '' }}
          THROWAWAY: ${{ needs.plan.outputs.publish != 'true' && '--throwaway' || '' }}
        run: node tools/release.mjs sign --dir release --channel "$CHANNEL" $THROWAWAY

      # The body: a stable release's CHANGELOG section (a missing one becomes a
      # sentence, never a blank body), or the commits a nightly adds; then how
      # to install this exact tag.
      - name: Release notes
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
          VERSION: ${{ needs.plan.outputs.version }}
          REF: ${{ needs.plan.outputs.ref }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
        run: node tools/release.mjs notes --channel "$CHANNEL" --version "$VERSION" --sha "$REF" --since "$PREVIOUS" --out release-notes.md

      # A tag that is already published is refused here, never rebuilt in place.
      # Drafts an earlier, failed attempt left behind go, so the release action
      # makes a fresh draft on this run's commit instead of reusing one.
      - name: Refuse a published tag, clear leftover drafts
        if: needs.plan.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: node tools/release.mjs clean-drafts --tag "$TAG"

      # A DRAFT first, with every file uploaded to it. Nobody sees a draft: not
      # the update check, not /releases/latest, not the next nightly's plan. It
      # becomes public in the next step, only after each attached file has
      # been checked against the one built here, so a failed upload never
      # leaves a published release without its zips or its manifest.
      - id: draft
        if: needs.plan.outputs.publish == 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ needs.plan.outputs.ref }}
          name: ${{ needs.plan.outputs.channel == 'nightly' && format('Nightly {0}', needs.plan.outputs.version) || needs.plan.outputs.tag }}
          prerelease: ${{ needs.plan.outputs.prerelease }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            release/*.zip
            release/SHA256SUMS
            release/manifest.json
            release/manifest.json.sig

      # Publishing a draft creates its tag when the tag does not exist yet (a
      # nightly or a promotion), on the planned commit. It is created with
      # GITHUB_TOKEN, and GitHub starts no workflow for an event that token
      # causes, so it does not trigger this workflow's own `push: tags` a second
      # time. Replacing the token with a personal one would.
      - name: Check the draft's files, then publish it
        if: needs.plan.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          REF: ${{ needs.plan.outputs.ref }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          LATEST: ${{ needs.plan.outputs.latest }}
        run: node tools/release.mjs publish --dir release --version "$VERSION" --ref "$REF" --release-id "$RELEASE_ID" --latest "$LATEST"

      - name: Dry run, nothing published
        if: needs.plan.outputs.publish != 'true'
        run: |
          {
            echo "### Dry run: nothing was published"
            echo
            echo "A release of this commit would be \`${{ needs.plan.outputs.tag }}\`, moving the image tags \`${{ needs.plan.outputs.moving_tags || 'none' }}\`, with this manifest.json:"
            echo
            echo '```json'
            cat release/manifest.json
            echo '```'
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: needs.plan.outputs.publish != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: |
            release/SHA256SUMS
            release/manifest.json
            release/manifest.json.sig
            release-notes.md

  # The image tags that MOVE, pointed at the image already pushed and
  # smoke-tested, once the release that names it is public: `latest` and the
  # minor and major lines for a stable release that is not an older line's hotfix,
  # `nightly` for a nightly (releasePlan's movingTags). A retag copies the
  # multi-arch manifest by digest; nothing is rebuilt.
  image-tags:
    needs: [plan, image, release]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.plan.outputs.publish == 'true' && needs.plan.outputs.moving_tags != '' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move the channel's image tags
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          MOVING: ${{ needs.plan.outputs.moving_tags }}
        # Three tries: the release is already public, and nothing reruns this
        # job by itself (the next nightly sees "nothing new"), so a registry
        # hiccup here would leave the tag behind until the next commit.
        run: |
          image="${IMAGE,,}"
          args=()
          for t in $MOVING; do args+=(-t "$image:$t"); done
          for attempt in 1 2 3; do
            docker buildx imagetools create "${args[@]}" "$image@$DIGEST" && exit 0
            echo "Retagging failed (attempt $attempt); trying again in 30 s."
            sleep 30
          done
          echo "::error::The release is public, but the image tags $MOVING still point at the previous image. Re-run this job."
          exit 1

  # A signed statement, kept by GitHub, that the published zips came out of
  # this repository's release workflow: `gh attestation verify <zip> -R <repo>`.
  # A job of its own because it needs a token that can mint OIDC tokens, which
  # the job holding the signing key, run on every pull request, never gets.
  attest:
    needs: [plan, release]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip
