# TEMPORARY: a stress run of hosted/copy.sh's concurrent new/remove block.
# Removed before the pull request is ready.
name: copy.sh stress
on:
  push:
    branches: [t3code/docker-ci-remove-race-in-copy-sh]
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        run: docker build -t terramentor:ci .
      - name: Stress
        run: bash .github/copyrace-stress.sh 25
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stress-out
          path: stress-out
