# Runs the project's own guard suites on every push and pull request.
#
# These are not incidental unit tests: each suite drives real modules against a
# scratch database or a stub and asserts an invariant the design depends on
# (the security boundary, the leaf definition, the FSRS scheduler, the feed's
# quality gates, the Anki format readers). None of them calls a model or the
# network, so they run anywhere in seconds.
#
# CI runs `npm test` and the steps around it (types, `node --check`, the
# link-time import, the build and, on Windows, the README's pictures);
# CONTRIBUTING.md lists the same six for a contributor to run locally.
#
# The Node matrix is not decoration. The floor declared in package.json
# `engines` is 24, the newest of the floors the dependencies declare: ts-fsrs
# 6, the FSRS-7 scheduler, requires it (before it, undici's 22.19 was the
# highest). 24 is in the matrix to keep that floor honest. No newer major beside
# it yet: better-sqlite3 lists the majors it supports and 26 is not one of
# them. tools/version-gates.mjs checks that every pin (this matrix, the other
# workflows, the Dockerfile, .nvmrc) sits at or above the floor and inside
# every dependency's list.
#
# Neither is the WINDOWS leg. This ran on ubuntu-latest alone, and a whole class
# of failure is invisible from there: `.gitattributes` is `* text=auto`, so a
# clone on Windows checks text files out with CRLF, and any suite comparing file
# bytes to freshly generated text fails on a file whose content is correct.
# `i18n-plural-gates.mjs` did exactly that, so `npm test` was red for every
# Windows contributor while CI was green — the one place a contributor's first
# impression is formed, and the one place CI could not look. One Windows job on
# the current Node is enough to keep it honest; the runner is slower and the
# point is the platform, not the version.
name: Gates

on:
  pull_request:
  push:
    branches: [main]

# These jobs only read and run the suite; nothing here publishes.
permissions:
  contents: read

jobs:
  gates:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['24']

    # Bash on every platform, so the steps below are one script and not two: the
    # `for f in server/*.js` loop is shell syntax, and a Windows runner otherwise
    # runs it under PowerShell, where it is a parse error rather than a result.
    defaults:
      run:
        shell: bash

    steps:
      # Full history, not the default single commit: tools/no-ai-attribution.mjs
      # reads commit messages over a range, and a shallow clone has no range to
      # read — it would pass by having nothing to look at.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Server parses
        run: |
          for f in server/*.js server/routes/*.js; do node --check "$f"; done

      - name: Server links
        # `node --check` is a parser: it cannot see a re-export with no local
        # binding, which fails only when the module graph is linked.
        run: node -e "import('./server/index.js').then(() => process.exit(0))"
        env:
          DB_PATH: ${{ runner.temp }}/ci.db
          VAULT_ROOT: ${{ runner.temp }}/ci-vault

      - name: Guard suites
        run: npm test

      - name: Frontend builds
        run: npm run build

      # The README's pictures against the app just built: tools/docs-shots.mjs
      # builds an invented course in a scratch library, opens the screen each
      # picture shows in headless Edge and compares its interface text with the
      # text recorded when the picture was taken. No model, no network. On the
      # Windows leg only: the app draws in the system font, and Windows is where
      # the pictures are recorded, so the same font lays out the same lines.
      - name: README pictures match the app
        if: matrix.os == 'windows-latest'
        timeout-minutes: 15
        run: node tools/docs-shots.mjs

  # The image, built and started on every pull request. Before this job only
  # the release workflow built it, so a change that broke the Dockerfile or the
  # build context was found when a release failed. Then the container is held
  # to the README's first visit, and hosted mode (docs/HOSTING.md) to its
  # promises: it refuses to start unlocked, and two copies behind the HTTPS
  # proxy are created, kept apart, backed up, restored and removed by
  # hosted/copy.sh exactly as on a server.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" -t terramentor:ci .

      - name: First visit to a fresh container
        run: |
          docker run -d --name smoke -p 127.0.0.1:3001:3001 terramentor:ci
          bash tools/first-visit-smoke.sh http://127.0.0.1:3001 "docker logs smoke"
          docker rm -f smoke

      - name: Hosted mode refuses to start without a password
        run: |
          set +e
          out="$(docker run --rm -e TERRAMENTOR_HOSTED=1 terramentor:ci 2>&1)"
          code=$?
          set -e
          echo "$out" | tail -5
          echo "exit code: $code"
          test "$code" = 1
          echo "$out" | grep -q 'Refusing to start: bound to 0.0.0.0 with no password'
          if echo "$out" | grep -q 'Server running at'; then echo 'it listened'; exit 1; fi

      - name: Two hosted copies behind the proxy
        run: TM_IMAGE=terramentor:ci bash hosted/rehearse.sh
