# A barrier for someone using assistive technology, or using the app in a way
# it does not expect: a keyboard only, a screen reader, a switch, speech input,
# magnification, high contrast, more time.
#
# Its own form rather than the bug form, because the bug form asks how to make
# the problem happen again and which part of the app it is in, and a person who
# hit a barrier often cannot answer either: the barrier is what stopped them
# finding out. What makes such a report actionable is the task they were doing,
# what got in the way, and the assistive technology they use, with its version,
# because two screen readers can read the same page differently.
#
# Not in REPORT_FORMS (src/utils/report.ts): the app's "Report a problem" dialog
# does not open this form, so no field here is pre-filled from a URL. If it ever
# does, tools/report-gates.mjs will hold its ids to the dialog's.
#
# Placeholders stay absent: an invented example in a box reads as the answer
# expected (tools/report-gates.mjs fails a placeholder over five words).
name: Something in the app is hard for you to use
description: A screen reader, keyboard, magnifier, voice control, larger text, reading, attention or timing problem stops you doing something.
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A barrier is treated as a bug. You do not need
        to know which accessibility rule it breaks: say what you were doing and
        what stopped you.

        This is a public tracker. Please leave out anything private, such as your
        name, a health condition you would rather not share, or what you study.
        A security problem goes to SECURITY.md instead, not here.

  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: >
        The task, in your own words. For example: review my flashcards, answer a
        quiz question, move a topic, change a setting.
    validations:
      required: true

  - type: textarea
    id: barrier
    attributes:
      label: What got in the way?
      description: >
        What happened instead. What you heard, or could not hear; where the focus
        went; what you could not reach, read or press.
    validations:
      required: true

  - type: textarea
    id: assistive-technology
    attributes:
      label: What you use to read or control the app, with its version (optional)
      description: >
        For example a screen reader, a magnifier, voice control, a switch, a
        keyboard only, or your system's high contrast or larger text settings.
        Leave it empty if you were not using any.
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: How you run the app, and on what system (optional)
      description: >
        The browser and its version, or the desktop app; your operating system.
        If you can reach Settings, "Copy details" under Library & about gives the
        app's version.
      render: text
    validations:
      required: false

  - type: input
    id: screen
    attributes:
      label: Which screen or page? (optional)
      description: For example the review session, Settings, a course's Dashboard or the atlas.
    validations:
      required: false
