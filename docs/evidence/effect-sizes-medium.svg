<text x="0.0" y="69.0" font-size="14" class="quiet">comparison group. 0.5 moves a middle student to about the 69th</text>
<text x="0.0" y="89.0" font-size="14" class="quiet">percentile. Lines: 95% intervals, where the study reports enough for one.</text>
