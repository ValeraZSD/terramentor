<text x="0.0" y="25.0" font-size="20" font-weight="600" class="ink">What the studies measured</text>
<text x="0.0" y="49.0" font-size="14" class="quiet">Effect on learning in standard deviations, against each study's own comparison group. 0.5 moves a middle</text>
<text x="0.0" y="69.0" font-size="14" class="quiet">student to about the 69th percentile. Lines: 95% intervals, where available.</text>
<text x="0.0" y="89.0" font-size="14" class="quiet">Each study used its own test, so a longer bar does not mean a better method, and the effects do not add up.</text>
