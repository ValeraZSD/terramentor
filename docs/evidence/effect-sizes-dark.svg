<text x="0.0" y="24.0" font-size="19" font-weight="600" class="ink">What the studies measured</text>
<text x="0.0" y="48.5" font-size="14.5" class="quiet">Effect on learning in standard deviations,</text>
<text x="0.0" y="69.0" font-size="14.5" class="quiet">against each study's own comparison group.</text>
<text x="0.0" y="89.5" font-size="14.5" class="quiet">0.5 moves a middle student to about the</text>
<text x="0.0" y="110.0" font-size="14.5" class="quiet">69th percentile. Lines: 95% intervals,</text>
<text x="0.0" y="130.5" font-size="14.5" class="quiet">where available.</text>
<text x="0.0" y="151.0" font-size="14.5" class="quiet">Each study used its own test, so a longer</text>
<text x="0.0" y="171.5" font-size="14.5" class="quiet">bar does not mean a better method, and the</text>
<text x="0.0" y="192.0" font-size="14.5" class="quiet">effects do not add up.</text>
<text x="0.0" y="226.5" font-size="14.5" font-weight="600" class="ink">Techniques the loop uses</text>
<text x="0.0" y="246.0" font-size="14.5" class="quiet">meta-analyses</text>
