<text x="0.0" y="48.5" font-size="14.5" class="quiet">Effect on learning in standard deviations,</text>
<text x="0.0" y="69.0" font-size="14.5" class="quiet">against each study's own comparison group.</text>
<text x="0.0" y="89.5" font-size="14.5" class="quiet">0.5 moves a middle student to about the</text>
<text x="0.0" y="110.0" font-size="14.5" class="quiet">69th percentile. Lines: 95% intervals,</text>
<text x="0.0" y="130.5" font-size="14.5" class="quiet">where available.</text>
